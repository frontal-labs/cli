name: Synthetic Monitor

on:
  schedule:
    # Every 15 minutes — off-peak minute to avoid fleet contention
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run journeys in dry-run mode'
        type: boolean
        default: true
      cli_version:
        description: 'Specific CLI version to test (default: latest)'
        type: string
        default: 'latest'

concurrency:
  group: synthetic-monitor
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  run-checks:
    name: Run Synthetic Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Frontal CLI
        run: |
          VERSION="${{ inputs.cli_version || 'latest' }}"
          npm install -g "frontal-cli@${VERSION}"
          frontal --version

      - name: Run E2E journeys
        id: journeys
        timeout-minutes: 12
        run: |
          export FRONTAL_API_KEY="${{ secrets.FRONTAL_TEST_API_KEY }}"
          export FRONTAL_API_URL="${{ secrets.FRONTAL_TEST_API_URL }}"
          export E2E_TIMEOUT_SECS="${{ vars.MONITOR_E2E_TIMEOUT_SECS || '120' }}"
          export E2E_DRY_RUN="${{ inputs.dry_run || false }}"
          .github/scripts/e2e-journey.sh
        env:
          FRONTAL_API_KEY: ${{ secrets.FRONTAL_TEST_API_KEY }}
          FRONTAL_API_URL: ${{ secrets.FRONTAL_TEST_API_URL }}

      - name: Upload run result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-result-${{ github.run_id }}
          path: run-result.json
          retention-days: 7
