name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The zsh completion test parses generated scripts with `zsh -n`.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Run tests
        run: bun run test

      # Actions cannot open pull requests in this repo. While changesets are
      # pending, push a "chore: release packages" branch and link to the compare
      # page. Once that PR merges, the tag step below tags the release, and
      # publish.yml does the publishing (npm via OIDC, GitHub Packages, GitHub
      # Release with binaries).
      - name: Version packages or tag the release
        id: release
        env:
          RELEASE_BRANCH: changeset-release/main
        run: |
          PENDING="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$PENDING" -gt 0 ]]; then
            bun run version-packages
            git checkout -B "$RELEASE_BRANCH"
            git add -A
            git commit -m "chore: release packages"
            git push --force origin "$RELEASE_BRANCH"
            {
              echo "### Release branch pushed"
              echo ""
              echo "Open the pull request: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${RELEASE_BRANCH}?expand=1"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            bunx changeset tag
            git push origin --tags
            echo "Tagged release; run publish.yml with the new tag to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
