name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      # Versions + opens the "chore: release packages" PR while changesets are
      # pending. Merging that PR tags vX.Y.Z; publish.yml does the publishing
      # (npm via OIDC, GitHub Packages, GitHub Release with binaries).
      - name: Create Release Pull Request or tag the release
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run build && changeset tag
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
