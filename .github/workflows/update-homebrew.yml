name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout CLI repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION=${{ github.ref_name }}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Update CLI formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Remove 'v' prefix if present
          CLEAN_VERSION=${VERSION#v}
          
          # Update the formula with new version
          sed -i.bak "s/tag:      \"v[^\"]*\"/tag:      \"$VERSION\"/" frontal.rb
          sed -i.bak "s/version: \"[^\"]*\"/version: \"$CLEAN_VERSION\"/" frontal.rb
          
          # Remove backup file
          rm frontal.rb.bak
          
          # Show changes
          git diff frontal.rb
          
      - name: Commit and push CLI changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontal.rb
          git commit -m "Update formula to version ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push
          
      - name: Update Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: frontal-labs/homebrew-cli
          token: ${{ secrets.HOMEBREW_TOKEN }}
          path: homebrew-tap
          
      - name: Update tap formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CLEAN_VERSION=${VERSION#v}
          
          cd homebrew-tap
          
          # Update the formula in the tap
          sed -i.bak "s/tag:      \"v[^\"]*\"/tag:      \"$VERSION\"/" Formula/frontal.rb
          sed -i.bak "s/version: \"[^\"]*\"/version: \"$CLEAN_VERSION\"/" Formula/frontal.rb
          
          # Remove backup file
          rm Formula/frontal.rb.bak
          
          # Show changes
          git diff Formula/frontal.rb
          
      - name: Commit and push tap changes
        run: |
          cd homebrew-tap
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Formula/frontal.rb
          git commit -m "Update frontal to version ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push
