name: Status Page Sync

on:
  schedule:
    # Every hour at an off-peak minute
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: status-page-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-components:
    name: Sync Component Health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            .github/incident
          sparse-checkout-cone-mode: false

      - name: Restore flap state
        id: restore-flap
        uses: actions/cache/restore@v4
        with:
          path: flap-state.json
          key: flap-state-prod
          restore-keys: flap-state-prod

      - name: Fetch status page structure
        id: fetch-structure
        env:
          INCIDENT_IO_API_KEY: ${{ secrets.INCIDENT_IO_API_KEY }}
          INCIDENT_IO_STATUS_PAGE_ID: ${{ vars.INCIDENT_IO_STATUS_PAGE_ID }}
        run: |
          if [[ -z "$INCIDENT_IO_API_KEY" ]]; then
            echo "INCIDENT_IO_API_KEY not configured — skipping"
            exit 0
          fi

          if [[ -z "$INCIDENT_IO_STATUS_PAGE_ID" ]]; then
            echo "INCIDENT_IO_STATUS_PAGE_ID not configured — skipping"
            exit 0
          fi

          # Get status page structure
          curl -s -H "Authorization: Bearer $INCIDENT_IO_API_KEY" \
            "https://api.incident.io/v2/status_page_structures/$INCIDENT_IO_STATUS_PAGE_ID" \
            > status-page-structure.json

          echo "Status page structure fetched"
          jq '.status_page_structure' status-page-structure.json 2>/dev/null || cat status-page-structure.json

      - name: Cross-reference with flap state
        id: cross-reference
        run: |
          echo "=== Reconciliation Report ==="

          if [[ -f flap-state.json ]]; then
            ALERTING="$(jq -r '.alerting // false' flap-state.json)"
            SP_ID="$(jq -r '.status_page_incident_id // "none"' flap-state.json)"
            CONSECUTIVE_FAILURES="$(jq -r '.consecutive_failures // 0' flap-state.json)"
            CONSECUTIVE_SUCCESSES="$(jq -r '.consecutive_successes // 0' flap-state.json)"

            echo "Alerting: $ALERTING"
            echo "Status Page Incident: $SP_ID"
            echo "Consecutive Failures: $CONSECUTIVE_FAILURES"
            echo "Consecutive Successes: $CONSECUTIVE_SUCCESSES"
          else
            echo "No flap state found — assuming healthy"
            echo "Alerting: false"
          fi

          if [[ -f .github/incident/components.json ]]; then
            echo ""
            echo "Configured components:"
            jq -r '.[] | "  - \(.component_id) (\(.name // "unnamed"))"' .github/incident/components.json 2>/dev/null || echo "  (empty or invalid)"
          fi

      - name: Detect stale incidents
        id: detect-stale
        env:
          INCIDENT_IO_API_KEY: ${{ secrets.INCIDENT_IO_API_KEY }}
        run: |
          if [[ -z "$INCIDENT_IO_API_KEY" ]]; then
            exit 0
          fi

          echo "Checking for stale status page incidents..."

          # List active status page incidents
          RESPONSE="$(curl -s -w '\n%{http_code}' \
            -H "Authorization: Bearer $INCIDENT_IO_API_KEY" \
            "https://api.incident.io/v2/status_page_incidents")"

          HTTP_CODE="$(echo "$RESPONSE" | tail -1)"
          BODY="$(echo "$RESPONSE" | sed '$d')"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Failed to list status page incidents (HTTP $HTTP_CODE)"
            exit 0
          fi

          # Find CLI monitor incidents
          CLI_INCIDENTS="$(echo "$BODY" | jq -r '
            .status_page_incidents[]? |
            select(.name | startswith("CLI Synthetic Monitoring")) |
            "\(.id) \(.incident_status) \(.name)"
          ' 2>/dev/null || echo "")"

          if [[ -z "$CLI_INCIDENTS" ]]; then
            echo "No CLI monitoring incidents found on status page"
          else
            echo "Active CLI monitoring incidents:"
            echo "$CLI_INCIDENTS"
          fi

      - name: Generate component status snapshot
        run: |
          cat > component-status.json << EOF
          {
            "generated_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "workflow_run": "${{ github.run_id }}",
            "alerting": $([ -f flap-state.json ] && jq -r '.alerting // false' flap-state.json || echo "false"),
            "active_incident": $([ -f flap-state.json ] && jq -r '.status_page_incident_id // "none"' flap-state.json || echo '"none"'),
            "consecutive_failures": $([ -f flap-state.json ] && jq -r '.consecutive_failures // 0' flap-state.json || echo "0"),
            "consecutive_successes": $([ -f flap-state.json ] && jq -r '.consecutive_successes // 0' flap-state.json || echo "0")
          }
EOF
          echo "Component status snapshot:"
          cat component-status.json

      - name: Upload component status
        uses: actions/upload-artifact@v4
        with:
          name: component-status
          path: component-status.json
          retention-days: 7
