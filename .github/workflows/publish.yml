name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      # npm >= 11.5 on Node 22 is required for OIDC trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          npm install -g npm@latest
          bun install --frozen-lockfile

      - name: Build (npm bundle + single binaries)
        run: |
          bun run build
          bun run build:binaries

      - name: Verify release binaries
        run: |
          test -x dist/binaries/cli
          test -x dist/binaries/cli-aarch64-apple-darwin
          test -x dist/binaries/cli-aarch64-unknown-linux-gnu
          test -f dist/binaries/cli-x86_64-pc-windows-msvc
          test -x dist/binaries/cli-x86_64-apple-darwin
          test -x dist/binaries/cli-x86_64-unknown-linux-gnu

      - name: Verify the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
          test "v${PKG_VERSION}" = "${RELEASE_TAG}" || { echo "tag ${RELEASE_TAG} != package.json ${PKG_VERSION}"; exit 1; }

      - name: Publish to GitHub Packages
        run: |
          ORIGINAL_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).name)")

          echo "registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@frontal-labs/cli';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          npm publish --ignore-scripts

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '${ORIGINAL_NAME}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          rm -f .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_provenance: "false"

      # OIDC trusted publisher (no NPM_TOKEN): configure this workflow as the
      # trusted publisher for frontal-cli on npmjs.com. This remains
      # non-blocking until that publisher is configured.
      - name: Publish to npm
        continue-on-error: true
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: |
            See [CHANGELOG.md](./CHANGELOG.md) for release notes.

            ## Installation

            ### NPM
            ```bash
            npm install -g frontal-cli@latest
            ```

            ### Homebrew
            ```bash
            brew tap frontal-labs/cli
            brew install frontal-cli
            ```

            ### Docker
            ```bash
            docker pull ghcr.io/frontal-labs/cli:latest
            ```

            ### GitHub Packages
            ```bash
            npm install -g @frontal-labs/cli --registry=https://npm.pkg.github.com
            ```

            ### Single binary
            Download the asset for your platform below, rename it to `cli` if needed,
            `chmod +x` it on macOS/Linux, and put it on your PATH.
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, 'alpha') || contains(inputs.tag || github.ref_name, 'beta') || contains(inputs.tag || github.ref_name, 'rc') }}
          files: |
            dist/index.js
            dist/binaries/cli
            dist/binaries/cli-aarch64-apple-darwin
            dist/binaries/cli-aarch64-unknown-linux-gnu
            dist/binaries/cli-x86_64-pc-windows-msvc
            dist/binaries/cli-x86_64-apple-darwin
            dist/binaries/cli-x86_64-unknown-linux-gnu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
