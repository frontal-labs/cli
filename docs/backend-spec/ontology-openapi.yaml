openapi: 3.1.0
info:
  title: Ontology
  description: 'The ontology plane: the domain model and its lifecycle. Defines concepts,
    entities, objects, relationships, schemas, taxonomies, vocabularies and mappings;
    derives knowledge through the graph, the rule engine and semantic extraction;
    and versions, validates and rolls out changes.'
  version: 1.0.0
